name: greenhouse-patterns
services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-greenhouse-patterns}-frontend
    ports: ["${FRONTEND_PORT:-18204}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-greenhouse-patterns}-backend
    ports: ["${BACKEND_PORT:-19204}:8000"]
    environment: &backend-env
      DATABASE_URL: postgresql://nanling:${DB_PASSWORD:-nanling-local-2611}@db:5432/nanling
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-nanling-demo-key-change-before-publishing-2611}
      SEED_DEMO: ${SEED_DEMO:-true}
      QUEUE_MODE: redis
      ARTIFACT_DIR: /artifacts
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 15
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-greenhouse-patterns}-worker
    command: ["python", "-m", "src.worker"]
    environment: *backend-env
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; from src.utils.redis_queue import command; assert command('PING')=='PONG'; assert time.time()-pathlib.Path('/tmp/greenhouse-worker-heartbeat').stat().st_mtime<45"]
      interval: 10s
      timeout: 5s
      retries: 10
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-greenhouse-patterns}-db
    ports: ["${DB_PORT:-17704}:5432"]
    environment:
      POSTGRES_DB: nanling
      POSTGRES_USER: nanling
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nanling-local-2611}
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanling -d nanling"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-greenhouse-patterns}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  artifacts:
